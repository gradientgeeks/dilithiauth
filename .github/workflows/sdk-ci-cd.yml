name: DilithiAuth SDK CI/CD & Publishing

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*', 'sdk-v*.*.*' ]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-ci-cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sdk/**'
  release:
    types: [ published ]

env:
  DILITHIAUTH_DEFAULT_DOMAIN: "https://dilithiauthapis.gradientgeeks.tech"

jobs:
  build-and-test:
    name: Build & Test All SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build JS SDK
        run: |
          cd sdk/js
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Test Go SDK
        run: |
          cd sdk/go
          go test -v ./...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sdk/python/pyproject.toml'

      - name: Test & Package Python SDK
        run: |
          cd sdk/python
          python -m unittest discover tests
          pip install build
          python -m build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java SDK
        run: |
          cd sdk/java
          mvn -B compile test-compile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack .NET SDK
        run: |
          cd sdk/dotnet/DilithiAuth.Client
          dotnet build --configuration Release
          dotnet pack --configuration Release

  publish-npm:
    name: Publish JS SDK to npm
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        run: |
          cd sdk/js
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish to PyPI
        run: |
          cd sdk/python
          pip install build twine
          python -m build
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}

  publish-nuget:
    name: Publish .NET SDK to NuGet
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Enable GitHub OIDC token issuance for Trusted Publishing on nuget.org
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and Pack .NET SDK
        run: |
          cd sdk/dotnet/DilithiAuth.Client
          dotnet pack -c Release
      - name: NuGet Login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: 'gradientgeeks'
      - name: Push to NuGet
        run: |
          cd sdk/dotnet/DilithiAuth.Client
          dotnet nuget push bin/Release/*.nupkg -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json

  publish-go:
    name: Index Go Module on Go Proxy
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Index on proxy.golang.org
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          go list -m "github.com/Uttam-Mahata/DilithiAuth/sdk/go@${TAG_NAME}" || true
