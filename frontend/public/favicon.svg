<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="DilithiAuth logo">
  <title>DilithiAuth — post-quantum lattice shield</title>
  <defs>
    <linearGradient id="da-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="da-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Shield: the "Auth" half of the mark -->
  <path d="M24 2.5 L40.5 9 V22.5 C40.5 33.5 33.5 42 24 45.5 C14.5 42 7.5 33.5 7.5 22.5 V9 Z"
        fill="url(#da-shield)"/>
  <path d="M24 2.5 L40.5 9 V22.5 C40.5 33.5 33.5 42 24 45.5 C14.5 42 7.5 33.5 7.5 22.5 V9 Z"
        fill="none" stroke="#312e81" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Lattice: a 3x3 basis-vector grid, representing lattice-based (ML-DSA/Dilithium)
       cryptography — the "Dilithi" half of the mark. Nodes + connecting basis
       vectors, not a literal padlock, so it reads as genuinely technical. -->
  <g stroke="#e0e7ff" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
    <line x1="16" y1="15" x2="24" y2="15"/>
    <line x1="24" y1="15" x2="32" y2="15"/>
    <line x1="16" y1="23" x2="24" y2="23"/>
    <line x1="24" y1="23" x2="32" y2="23"/>
    <line x1="16" y1="15" x2="16" y2="23"/>
    <line x1="24" y1="15" x2="24" y2="23"/>
    <line x1="32" y1="15" x2="32" y2="23"/>
    <line x1="16" y1="15" x2="24" y2="23"/>
    <line x1="24" y1="15" x2="32" y2="23"/>
  </g>
  <g fill="#eef2ff">
    <circle cx="16" cy="15" r="1.9"/>
    <circle cx="24" cy="15" r="1.9"/>
    <circle cx="32" cy="15" r="1.9"/>
    <circle cx="16" cy="23" r="1.9"/>
    <circle cx="24" cy="23" r="1.9"/>
    <circle cx="32" cy="23" r="1.9"/>
  </g>

  <!-- Verified checkmark: confirms the identity/auth outcome -->
  <path d="M17 31.5 L22 36.5 L32 25.5" fill="none" stroke="url(#da-check)"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
