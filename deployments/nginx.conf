# Nginx configuration for dilithiauth.gradientgeeks.tech
# Sits behind Cloudflare (Full Strict SSL + Authenticated Origin Pulls).
# TLS is terminated here using a Cloudflare Origin Certificate.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # PQC jumbo-header tuning (ML-DSA-44 hybrid JWTs reach ~4 KB).
    client_header_buffer_size    8k;
    large_client_header_buffers  4 16k;

    # Cloudflare real-IP restoration.
    # See https://www.cloudflare.com/ips/ for the full list.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    upstream dilithiauth {
        server server:8080;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS.
    server {
        listen 80;
        server_name dilithiauth.gradientgeeks.tech;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name dilithiauth.gradientgeeks.tech;

        # Cloudflare Origin Certificate (generated from CF dashboard).
        ssl_certificate     /etc/ssl/dilithiauth/origin.crt;
        ssl_certificate_key /etc/ssl/dilithiauth/origin.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Cloudflare SSL Origin Certificate settings.
        # ssl_client_certificate /etc/ssl/dilithiauth/cloudflare-origin-pull-ca.pem;
        ssl_verify_client off;

        # Bypass cache for dynamic endpoints.
        location ~ ^/(authorize|token|revoke|api/|developer/) {
            proxy_pass         http://dilithiauth;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_buffer_size  16k;
            proxy_buffers      4 16k;
            add_header Cache-Control "no-store, no-cache" always;
        }

        # Everything else (OIDC discovery, JWKS, health).
        location / {
            proxy_pass         http://dilithiauth;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_buffer_size  16k;
            proxy_buffers      4 16k;
        }
    }
}
