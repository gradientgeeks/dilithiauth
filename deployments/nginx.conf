# deployments/nginx.conf
#
# Nginx reverse-proxy configuration for DilithiAuth.
#
# PQC tokens (ML-DSA-44 hybrid JWTs) can reach 3.5–4 KB in the Authorization
# header, which exceeds Nginx's default 4 KB limit.  The buffer settings below
# must be applied to prevent Nginx from returning 400 / 414 errors.
#
# Apply this configuration under the `http {}` block of nginx.conf or inside
# the relevant `server {}` block.

http {
    # -----------------------------------------------------------------
    # PQC Jumbo-header tuning
    # -----------------------------------------------------------------

    # Allow a single header line up to 8 KiB (covers a full hybrid JWT).
    client_header_buffer_size 8k;

    # Allow up to 4 × 16 KiB for the complete header section.
    # This accommodates multiple Authorization / Cookie headers on the same
    # request, each potentially containing a PQC token.
    large_client_header_buffers 4 16k;

    # -----------------------------------------------------------------
    # Upstream: DilithiAuth server
    # -----------------------------------------------------------------
    upstream dilithiauth {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        server_name auth.dilithiauth.io;

        ssl_certificate     /etc/ssl/certs/dilithiauth.crt;
        ssl_certificate_key /etc/ssl/private/dilithiauth.key;

        # Pass all requests to the Go server.
        location / {
            proxy_pass         http://dilithiauth;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;

            # Forward the Authorization header unchanged (may contain a
            # PQC-sized token up to ~4 KB).
            proxy_pass_request_headers on;

            # Increase proxy buffer size to handle large response headers
            # (e.g. JWKS documents containing ML-DSA-44 public keys).
            proxy_buffer_size          16k;
            proxy_buffers              4 16k;
        }
    }
}
